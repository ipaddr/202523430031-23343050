name: polarna
description: "ColdShare Platform - Aplikasi logistik rantai dingin terdesentralisasi"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.2
  firebase_messaging: ^15.1.3
  cloud_functions: ^5.1.3

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.3.0

  # Maps
  google_maps_flutter: ^2.9.0
  geolocator: ^13.0.1
  geocoding: ^3.0.0

  # IoT / QR
  mobile_scanner: ^5.2.3

  # UI & Charts
  fl_chart: ^0.69.0
  qr_flutter: ^4.1.0
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  shimmer: ^3.0.0

  # Utilities
  connectivity_plus: ^6.0.5
  intl: ^0.19.0
  csv: ^6.0.0
  dartz: ^0.10.1
  equatable: ^2.0.5
  uuid: ^4.5.1
  http: ^1.2.2
  shared_preferences: ^2.3.2
  flutter_animate: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.4.3
  build_runner: ^2.4.12
  mockito: ^5.4.4
  fake_cloud_firestore: ^3.0.3
  glados: ^1.1.7
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"